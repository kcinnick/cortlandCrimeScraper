name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies: [baseline, upgrades]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - if: matrix.dependencies == 'upgrades'
        run: python -m pip install requests==2.33.0 flask==3.1.3 pytest==9.0.3
      - run: python -m pytest -q
